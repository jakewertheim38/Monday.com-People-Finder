name: Deploy to monday code

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosting:
        description: "server = monday code server (default). client = monday's CDN."
        type: choice
        options: [server, client]
        default: server

env:
  APP_VERSION_ID: "18198232"
  HOSTING: ${{ inputs.hosting || 'server' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Find the app
        run: |
          PKG=$(grep -rl --include=package.json '"name": "monday-assignment-admin"' . --exclude-dir=node_modules --exclude-dir=.git | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::Couldn't find the app's package.json. Files in the repo:"
            find . -not -path './.git/*' -maxdepth 4 | sort
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "App found in: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Files in the app folder:"
          find "$APP_DIR" -not -path '*/node_modules/*' -type f | sort

      - name: Install, test and build
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          if [ -f src/people.test.js ]; then npm run check; else echo "::warning::Tests not found - src/people.test.js wasn't uploaded"; fi
          npm run build -- --base=./
          test -f dist/index.html || { echo "::error::The build did not create dist/index.html"; exit 1; }
          if grep -q 'src="/assets' dist/index.html; then
            echo "::error::dist/index.html uses absolute /assets paths - the page would be blank in monday"
            exit 1
          fi
          echo "Built page:"
          cat dist/index.html

      - name: Keep a copy of the build
        uses: actions/upload-artifact@v4
        with:
          name: administration-view-dist
          path: ${{ env.APP_DIR }}/dist

      - name: Install monday CLI
        run: |
          npm install -g @mondaycom/apps-cli@latest
          mapps --version

      - name: Sign in to monday
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          if [ -z "$MONDAY_TOKEN" ]; then echo "::error::Add a repository secret called MONDAY_TOKEN"; exit 1; fi
          # Keep only the token itself, even if "mapps init -t", spaces or line breaks were pasted in
          TOKEN=$(printf '%s' "$MONDAY_TOKEN" | tr -s ' \n\r\t' '\n' | tail -n 1)
          echo "::add-mask::$TOKEN"
          WORDS=$(printf '%s' "$MONDAY_TOKEN" | wc -w)
          echo "Secret contains $WORDS word(s); using the last one (${#TOKEN} characters)."
          case "$TOKEN" in eyJ*) echo "Token format looks right." ;; *) echo "::warning::Token doesn't start with eyJ - check it's a Developer Centre access token." ;; esac
          mapps init -t "$TOKEN"

      - name: Deploy to monday code server (server-side)
        if: env.HOSTING == 'server'
        run: |
          if [ ! -f "$APP_DIR"/monday-code-server/server.js ]; then echo "::error::monday-code-server/server.js wasn't uploaded"; exit 1; fi
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle
          cp "$APP_DIR"/monday-code-server/server.js "$APP_DIR"/monday-code-server/package.json /tmp/bundle/
          cp -r "$APP_DIR"/dist /tmp/bundle/public
          ls -R /tmp/bundle | head -20
          REGION_FLAG=""
          if [ -n "${{ vars.MONDAY_REGION }}" ]; then REGION_FLAG="-z ${{ vars.MONDAY_REGION }}"; fi
          mapps code:push -i "$APP_VERSION_ID" -d /tmp/bundle $REGION_FLAG --verbose

      - name: Deploy to monday CDN (client-side)
        if: env.HOSTING == 'client'
        working-directory: ${{ env.APP_DIR }}
        run: mapps code:push --client-side --directoryPath ./dist --appVersionId "$APP_VERSION_ID" --verbose
