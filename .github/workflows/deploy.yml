name: Deploy to monday code

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest monday CLI
        run: |
          npm install -g @mondaycom/apps-cli@latest
          mapps --version

      - name: Build and deploy Administration View
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          set -e

          PKG=$(find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$PKG" ]; then
            echo "::error::package.json was not found"
            exit 1
          fi

          APP_DIR=$(dirname "$PKG")
          echo "Building app in: $APP_DIR"

          cd "$APP_DIR"
          npm ci
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "::error::Build did not create dist/index.html"
            exit 1
          fi

          mapps init -t "$MONDAY_TOKEN"

          mapps code:push \
            --client-side \
            --directoryPath ./dist \
            --appVersionId 18198232
